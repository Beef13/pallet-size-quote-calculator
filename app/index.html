<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pallet Quote</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Calculate quotes for timber pallets with 3D visualization" />
    <meta name="theme-color" content="#2563d9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pallet Calc" />
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      // Not for the demonstration embedded in the landing page: that page has nothing to keep offline
      if ('serviceWorker' in navigator && !new URLSearchParams(window.location.search).has('demo')) {
        window.addEventListener('load', () => {
          // The service worker lives at the site root, one level above /app/
          const swPath = new URL('../sw.js', window.location.href).pathname;
          navigator.serviceWorker.register(swPath, { scope: new URL('../', window.location.href).pathname })
            .then(() => navigator.serviceWorker.ready)
            .then((registration) => {
              // Keep a copy of everything this first visit loaded, so the
              // calculator opens without signal next time
              const urls = [window.location.href].concat(
                performance.getEntriesByType('resource')
                  .map((entry) => entry.name)
                  .filter((url) => url.startsWith(window.location.origin))
              );
              registration.active && registration.active.postMessage({ type: 'cache-urls', urls });
            })
            .catch((error) => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
